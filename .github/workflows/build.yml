name: Compiler MaGalerie-3DS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Compiler
        run: make

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: MaGalerie-3DS
          path: |
            MaGalerie-3DS.3dsx
            MaGalerie-3DS.elf